services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/gateway.db
      CONFIG_PATH: config/providers.yml
    ports:
      - "18789:18789"
    volumes:
      - ./config/providers.yml:/app/config/providers.yml:ro
      - gateway-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.samuelm.de
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18789}
      NODE_OPTIONS: ""
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  gateway-data:
